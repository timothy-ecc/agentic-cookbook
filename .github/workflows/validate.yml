name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "stable"
      # Adding a language? If its toolchain is not already on ubuntu-latest,
      # add a setup step for it above this one.
      - name: Validate and run recipes
        run: python scripts/validate.py --strict
